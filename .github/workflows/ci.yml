name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test with coverage, build, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Every action is pinned to a commit; Dependabot proposes newer ones.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for the browser tests
        run: pnpm --filter @urlresolve/browser-resolver exec playwright-core install --with-deps --only-shell chromium
      # Ubuntu 24.04 keeps programs from creating the user namespaces Chromium's sandbox runs in;
      # the resolver starts Chromium sandboxed on purpose, so the runner allows them.
      - name: Let Chromium use its sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Lint, typecheck, test with coverage, build
        run: pnpm verify
      - name: Dependency audit
        run: pnpm audit --prod
      - name: Registry signatures
        run: pnpm audit signatures
